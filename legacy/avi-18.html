<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avi — XVIII</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,200;0,300;1,200;1,300&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #f2ece2;
    --ink: #1e1a16;
    --muted: #8a7968;
    --gold: #b89460;
    --fog: #ddd5c8;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
  }

  body {
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
  }

  /* Grain */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: 0.032; pointer-events: none; z-index: 100; mix-blend-mode: multiply;
  }

  /* Faint horizontal rule */
  body::after {
    content: '';
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 1px; height: 72vh;
    background: linear-gradient(to bottom, transparent, var(--fog) 30%, var(--fog) 70%, transparent);
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
  }

  .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    z-index: 1;
    text-align: center;
    user-select: none;
  }

  /* — A V I — */
  .name {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: clamp(68px, 14vw, 148px);
    font-weight: 400;
    color: var(--ink);
    letter-spacing: 0.18em;
    line-height: 1;
    opacity: 0;
    animation: riseIn 1.6s cubic-bezier(0.22, 0.61, 0.36, 1) 0.2s forwards;
    position: relative;
  }

  /* subtle warm glow under the name */
  .name::after {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    color: var(--gold);
    filter: blur(28px);
    opacity: 0.22;
    pointer-events: none;
    z-index: -1;
  }

  /* thin ornamental line */
  .ornament {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 22px 0 20px;
    opacity: 0;
    animation: fadeIn 1.4s ease 1s forwards;
  }

  .ornament-line {
    width: 56px; height: 1px;
    background: linear-gradient(to right, transparent, var(--gold));
  }
  .ornament-line:last-child {
    background: linear-gradient(to left, transparent, var(--gold));
  }

  .ornament-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0.7;
  }

  /* — XVIII — */
  .number {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 200;
    font-size: clamp(15px, 2.2vw, 22px);
    letter-spacing: 0.55em;
    color: var(--muted);
    text-transform: uppercase;
    opacity: 0;
    animation: riseIn 1.4s cubic-bezier(0.22, 0.61, 0.36, 1) 1.2s forwards;
    padding-left: 0.55em; /* compensate letter-spacing for centering */
  }

  /* corner marks */
  .corner {
    position: fixed;
    width: 20px; height: 20px;
    opacity: 0;
    animation: fadeIn 1.8s ease 1.6s forwards;
  }
  .corner--tl { top: 36px; left: 40px; border-top: 1px solid var(--fog); border-left: 1px solid var(--fog); }
  .corner--tr { top: 36px; right: 40px; border-top: 1px solid var(--fog); border-right: 1px solid var(--fog); }
  .corner--bl { bottom: 36px; left: 40px; border-bottom: 1px solid var(--fog); border-left: 1px solid var(--fog); }
  .corner--br { bottom: 36px; right: 40px; border-bottom: 1px solid var(--fog); border-right: 1px solid var(--fog); }

  /* tiny year bottom-right */
  .meta {
    position: fixed;
    bottom: 38px; right: 44px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--fog);
    opacity: 0;
    animation: fadeIn 2s ease 2s forwards;
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(22px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
</style>
</head>
<body>

  <div class="corner corner--tl"></div>
  <div class="corner corner--tr"></div>
  <div class="corner corner--bl"></div>
  <div class="corner corner--br"></div>

  <div class="stage">
    <h1 class="name" data-text="Avi">Avi</h1>
    <div class="ornament">
      <div class="ornament-line"></div>
      <div class="ornament-dot"></div>
      <div class="ornament-dot" style="opacity:.35"></div>
      <div class="ornament-dot"></div>
      <div class="ornament-line"></div>
    </div>
    <p class="number">XVIII</p>
  </div>

  <span class="meta">MMXXVI</span>

</body>
</html>
